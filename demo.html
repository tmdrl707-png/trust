<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>믿음의 금고 체험</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0C1330;--card:#18224D;--card2:#212D62;--line:rgba(255,255,255,.12);
  --fg:#F4F6FF;--mut:#A6B0DA;--gold:#F4C24D;--gold2:#FFE39C;--o:#2CC8B5;--x:#F05A68;
  --fd:'Black Han Sans','Pretendard','Apple SD Gothic Neo',sans-serif;
  --fb:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
html,body{min-height:100%}
body{font-family:var(--fb);color:var(--fg);background:var(--bg);
  background-image:radial-gradient(1100px 620px at 50% -15%,#26346f 0%,rgba(12,19,48,0) 70%);background-attachment:fixed;
  word-break:keep-all;-webkit-tap-highlight-color:transparent;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.75em 1.2em;border-radius:14px;
  background:var(--card2);border:1px solid var(--line);font-weight:700;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.12)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1d00;border:0}
.btn.big{width:100%;font-size:1.15rem;padding:1em}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.o{color:var(--o)}.x{color:var(--x)}.g{color:var(--gold)}
.note{color:var(--mut);font-size:.85rem;text-align:center;margin-top:14px;line-height:1.6}
#net{position:fixed;top:0;left:0;right:0;z-index:99;background:var(--x);color:#fff;text-align:center;font-weight:700;padding:7px;
  transform:translateY(-100%);transition:transform .3s}
#net.on{transform:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;font-weight:700;
  padding:10px 18px;border-radius:999px;z-index:98;transition:.3s;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(244,194,77,.0)}50%{box-shadow:0 0 0 6px rgba(244,194,77,.25)}}

/* ===== 입장 ===== */
.E{max-width:440px;margin:0 auto;padding:36px 20px 60px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.E-logo{width:112px;margin:0 auto 6px;animation:float 3.2s ease-in-out infinite}
.E-title{font-family:var(--fd);font-size:46px;text-align:center;color:var(--gold);letter-spacing:.02em;line-height:1.15}
.E-sub{text-align:center;color:var(--mut);margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.card label{display:block;font-size:.9rem;color:var(--mut);margin:10px 0 6px;font-weight:600}
.card input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0f1840;color:var(--fg);font-size:1.2rem;outline:none}
.card input:focus{border-color:var(--gold)}
.card .btn{margin-top:16px}
.err{color:var(--x);min-height:1.4em;margin-top:10px;text-align:center;font-weight:600;font-size:.95rem}
.teacher{margin-top:26px;text-align:center;color:var(--mut)}
.teacher summary{cursor:pointer;font-size:.9rem;list-style:none}
.teacher summary::-webkit-details-marker{display:none}
.teacher .btn{margin-top:10px;width:100%}

/* ===== 학생 휴대폰 ===== */
.P{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px calc(14px + env(safe-area-inset-bottom))}
.P-top{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.P-top b{font-size:1.05rem}
.tot{font-weight:800;color:var(--gold)}
.P-body{flex:1;padding:18px 0}
.fresh .P-body>*{animation:rise .45s both}
.fresh .P-body>*:nth-child(2){animation-delay:.08s}
.fresh .P-body>*:nth-child(3){animation-delay:.16s}
.P-foot{display:flex;gap:8px}
.P-foot .btn{flex:1;font-size:.95rem}
.rbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center;margin-bottom:12px}
.rn{font-family:var(--fd);font-size:.95rem;color:var(--gold);letter-spacing:.12em}
.rt{font-family:var(--fd);font-size:1.7rem;margin:2px 0 8px;line-height:1.2}
.pot{display:inline-flex;align-items:center;gap:6px;background:rgba(244,194,77,.15);color:var(--gold2);padding:6px 12px;border-radius:999px;font-weight:800}
.pot.sm{padding:.15em .6em;font-size:.95em}
.mates{list-style:none;margin-top:6px;display:grid;gap:8px}
.mates li{background:var(--card2);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem}
.mates li.me{outline:2px solid var(--gold)}
.mates li em{font-style:normal;font-weight:800}
.mates li.win em{color:var(--gold)}.mates li.zero em{color:var(--mut)}
.cd{font-family:var(--fd);font-size:2.6rem;color:var(--gold);display:block;line-height:1.1;margin-top:6px}
.cd.end{color:var(--x)}
.tip{color:var(--mut);font-size:.92rem;margin-top:10px;text-align:center;line-height:1.6}
.sub-h{font-weight:700;color:var(--mut);margin:14px 2px 6px;font-size:.92rem}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.pk{border-radius:22px;padding:24px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:1.05rem;border:2px solid transparent}
.pk .sym{font-family:var(--fd);font-size:4.4rem;line-height:1}
.pk.o{background:rgba(44,200,181,.14);color:var(--o);border-color:rgba(44,200,181,.5)}
.pk.x{background:rgba(240,90,104,.13);color:var(--x);border-color:rgba(240,90,104,.5)}
.pk small{font-weight:600;color:var(--mut);font-size:.8rem;text-align:center;line-height:1.4}
.conf{background:var(--card);border:2px solid var(--gold);border-radius:20px;padding:20px;text-align:center}
.conf .sym{font-family:var(--fd);font-size:5rem;line-height:1}
.conf p{color:var(--mut);margin:8px 0 14px;font-size:.92rem}
.conf .row{display:flex;gap:10px}.conf .row .btn{flex:1}
.done{text-align:center;padding:26px 16px;background:var(--card);border-radius:20px;border:1px solid var(--line)}
.done .chk{width:76px;height:76px;border-radius:50%;background:rgba(44,200,181,.15);color:var(--o);font-size:42px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.res{border-radius:20px;padding:20px;text-align:center;border:1px solid var(--line);background:var(--card);margin-bottom:12px}
.res.kind-share{border-color:rgba(44,200,181,.6)}
.res.kind-steal{border-color:rgba(244,194,77,.6)}
.res.kind-alarm{border-color:rgba(240,90,104,.7);animation:shake .5s .3s}
.res-k{font-family:var(--fd);font-size:1.35rem}
.res-s{color:var(--mut);font-size:.9rem}
.big-c{font-family:var(--fd);font-size:4.2rem;color:var(--gold);line-height:1.1;margin:8px 0 2px}
.big-c.zero{color:var(--mut)}
.mych{font-weight:700;color:var(--mut)}
.k-share{color:var(--o)}.k-steal{color:var(--gold)}.k-alarm{color:var(--x)}
.seal-p{text-align:center;padding:24px 10px}
.seal-p svg{width:150px;animation:float 3s ease-in-out infinite}
.seal-p h2{font-family:var(--fd);font-size:1.8rem;color:var(--gold);margin:8px 0}
.seal-p p{color:var(--mut)}
.rankbig{font-family:var(--fd);font-size:5rem;color:var(--gold);line-height:1}

/* ===== 오버레이 ===== */
.ov{position:fixed;inset:0;background:rgba(5,8,20,.86);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.ov-in{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:1300px;width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.ov-h{display:flex;align-items:center;gap:.6em;padding:.8em 1.1em;border-bottom:1px solid var(--line)}
.ov-h h3{flex:1;font-size:1.15em}
.ov-h .btn{padding:.45em .9em}
.ov-b{overflow:auto;padding:.2em 1.1em 1.1em}
table.rec{width:100%;border-collapse:collapse;font-size:1em}
table.rec th,table.rec td{padding:.45em .5em;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.rec th{position:sticky;top:0;background:var(--card);color:var(--mut);font-weight:700;z-index:1}
table.rec td:first-child,table.rec th:first-child{text-align:left}
table.rec td.nm{font-weight:700}
table.rec td.tt{color:var(--gold);font-weight:800}
table.rec .tm{color:var(--mut);font-size:.8em;margin-right:.3em}
table.rec .au{color:var(--mut);font-size:.75em}
table.rec .hid{opacity:.55}

/* ===== 교사 화면 (전자칠판) ===== */
body.board{overflow:hidden}
.B{height:100vh;display:flex;flex-direction:column;font-size:clamp(13px,1.05vw,26px)}
.B-top{display:flex;align-items:center;gap:1em;padding:.7em 1.6em;border-bottom:1px solid var(--line)}
.B-brand{font-family:var(--fd);color:var(--gold);font-size:1.4em;display:flex;align-items:center;gap:.4em}
.B-brand svg{width:1.5em;height:1.5em}
.B-mid{flex:1;display:flex;justify-content:center;gap:.4em}
.dot{width:2.2em;height:.5em;border-radius:99px;background:var(--card2)}
.dot.on{background:var(--gold)}.dot.now{background:var(--gold2);animation:glow 1.6s infinite}
.B-code{color:var(--mut);font-weight:700}
.B-code b{color:var(--fg);font-size:1.25em;letter-spacing:.06em}
.mqr{display:flex;align-items:center;gap:.55em;background:none;border:0;color:var(--mut);cursor:pointer;padding:0;margin:-.35em .4em -.35em -.6em;text-align:left;font:inherit;font-size:.85em;line-height:1.25}
.mqr img{width:4.4em;height:4.4em;background:#fff;padding:.25em;border-radius:.35em;display:block}
.mqr b{color:var(--gold)}
.qrov{position:fixed;inset:0;z-index:150;background:rgba(5,8,20,.85);display:flex;align-items:center;justify-content:center;cursor:pointer;animation:rise .2s both;font-size:clamp(14px,1.3vw,30px);text-align:center}
.qrov img{width:min(60vh,26em);height:min(60vh,26em);background:#fff;padding:1em;border-radius:1em}
.qrov p{font-size:1.5em;font-weight:800;margin-top:.6em}.qrov b{color:var(--gold)}.qrov small{color:var(--mut)}
.B-main{flex:1;overflow:hidden;position:relative;min-height:0}
.B-bar{display:flex;align-items:center;gap:.7em;padding:.65em 1.4em;border-top:1px solid var(--line);background:rgba(0,0,0,.22)}
.B-bar .lbl b{color:var(--fg);letter-spacing:.06em;font-size:1.15em}
.B-bar .btn.ic{padding:.55em .7em}
.B-bar .lbl{flex:1;color:var(--mut);font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.B-bar .btn{white-space:nowrap}
.B-bar .btn{font-size:.95em;padding:.55em .95em;border-radius:.7em}
.B-bar .btn.gold{font-size:1.15em;padding:.65em 1.6em}
.L{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:2.4em;min-height:100%;align-items:center}
.L-left{text-align:center;display:flex;flex-direction:column;align-items:center}
.L-logo{width:6.5em;animation:float 3.2s ease-in-out infinite}
.L-title{font-family:var(--fd);font-size:4.6em;color:var(--gold);line-height:1.1}
.L-sub{color:var(--mut);font-size:1.3em;margin-bottom:.9em}
.qr{background:#fff;padding:.7em;border-radius:1em;width:13em;height:13em;display:flex;align-items:center;justify-content:center;color:#333;font-size:.9em}
.qr img,.qr canvas{width:100%!important;height:auto!important;display:block}
.L-code{font-size:1.4em;margin-top:.5em}
.L-code b{font-family:var(--fd);color:var(--gold);font-size:1.9em;letter-spacing:.12em;vertical-align:-.1em}
.L-url{color:var(--mut);font-size:.9em;margin-top:.3em;word-break:break-all}
.L-right h3{font-size:1.5em;margin-bottom:.6em}
.L-right h3 b{color:var(--gold);font-family:var(--fd);font-size:1.4em}
.chips{display:flex;flex-wrap:wrap;gap:.5em;min-height:5em;align-content:flex-start;max-height:40vh;overflow:auto}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:.35em .95em;font-weight:700;font-size:1.1em;animation:pop .35s both}
.chip:hover{border-color:var(--x);color:var(--x)}
.empty{color:var(--mut)}
.set{margin-top:1.3em;background:var(--card);border:1px solid var(--line);border-radius:1em;padding:.9em 1.1em}
.set h4{color:var(--mut);margin-bottom:.6em;font-size:1em}
.srow{display:flex;gap:.55em;flex-wrap:wrap}
.sbox{background:var(--card2);border-radius:.8em;padding:.45em .6em;text-align:center;min-width:6.4em}
.sbox .k{color:var(--mut);font-size:.82em;font-weight:700}
.sbox .v{display:flex;align-items:center;justify-content:center;gap:.4em;font-weight:800;font-size:1.15em}
.sbox .v button{width:1.6em;height:1.6em;border-radius:50%;background:rgba(255,255,255,.1);line-height:1}
.sbox.fix .v,.sbox .v.fixv{color:var(--mut);font-size:.95em;padding:.15em 0}
.sbox.sealbx{outline:2px solid var(--gold)}
.lockb{margin-top:.35em;width:100%;background:rgba(255,255,255,.08);color:var(--mut);border-radius:.6em;padding:.3em .5em;font-weight:800;font-size:.9em}
.lockb.on{background:var(--gold);color:#1a1300}
.bots{margin-top:.8em;display:flex;gap:.5em;align-items:center;color:var(--mut)}
.RH{display:flex;align-items:center;gap:1em;margin-bottom:.9em;flex-wrap:wrap}
.RH-n{font-family:var(--fd);font-size:1.15em;color:#1a1300;background:var(--gold);padding:.2em .7em;border-radius:.4em;letter-spacing:.08em}
.RH-t{font-family:var(--fd);font-size:2.5em;line-height:1.1}
.RH-s{font-size:1.25em;color:var(--mut);font-weight:700}
.RH-s b{color:var(--gold);font-family:var(--fd);font-size:1.45em}
.RH-r{margin-left:auto;text-align:right;color:var(--mut);font-weight:700;font-size:1.15em}
.RH-r .cd{display:inline;font-size:2em;margin:0 0 0 .3em}
.rules{display:flex;gap:.55em;flex-wrap:wrap;margin-bottom:1em}
.rule{padding:.3em .9em;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.95em}
.rule i{font-style:normal;font-weight:800}
.rule.sealr{border-color:var(--gold);color:var(--gold)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw,16em),1fr));gap:.9em}
.tc{background:var(--card);border:1px solid var(--line);border-radius:1em;padding:.8em .9em;display:flex;flex-direction:column}
.fresh .tc{animation:rise .5s both;animation-delay:calc(var(--i)*55ms)}
.tc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5em}
.tc-h b{font-family:var(--fb);font-weight:900;font-size:1.35em}
.tc ul{list-style:none;display:grid;gap:.32em}
.tc li{display:flex;justify-content:space-between;align-items:center;gap:.4em;background:var(--card2);border-radius:.55em;padding:.32em .7em;font-weight:700;font-size:1.12em}
.tc li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc li em{font-style:normal;font-weight:800}
.tc li.ok em{color:var(--o)}.tc li.wait em{color:var(--mut)}
.tc li.win em{color:var(--gold)}.tc li.zero em{color:var(--mut)}
.tc-k{margin-top:.55em;text-align:center;font-weight:800;padding:.35em;border-radius:.6em;font-size:1.05em}
.tc-k.k-share{background:rgba(44,200,181,.16)}
.tc-k.k-steal{background:rgba(244,194,77,.16)}
.tc-k.k-alarm{background:rgba(240,90,104,.2)}
.tc.kind-share{border-color:rgba(44,200,181,.55)}
.tc.kind-steal{border-color:rgba(244,194,77,.55)}
.tc.kind-alarm{border-color:rgba(240,90,104,.7)}
.fresh .tc.kind-alarm{animation:rise .5s both,shake .5s .7s;animation-delay:calc(var(--i)*55ms),calc(var(--i)*55ms + .6s)}
.tc-sub{margin-top:.45em;text-align:right;color:var(--mut);font-weight:700;font-size:.9em}
.summ{display:flex;gap:.6em;margin-bottom:1em;flex-wrap:wrap}
.summ span{background:var(--card);border-radius:.7em;padding:.35em .9em;font-weight:800}
.seal{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.5em}
.seal svg{width:12em;animation:float 3s ease-in-out infinite}
.seal h2{font-family:var(--fd);font-size:3.3em;color:var(--gold);line-height:1.15}
.seal p{font-size:1.4em;color:var(--mut)}
.unseal{display:inline-block;align-self:flex-start;font-family:var(--fd);background:var(--gold);color:#1a1300;padding:.2em .8em;border-radius:.4em;margin-bottom:.6em;font-size:1.2em;animation:pop .5s both}
.fin-h{text-align:center;font-family:var(--fd);font-size:2.8em;color:var(--gold);line-height:1.2}
.fin-s{text-align:center;color:var(--mut);font-size:1.15em;margin-bottom:.6em}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:1.2em;margin:.6em 0 1.2em}
.pd{text-align:center;width:15em;animation:rise .7s both}
.pd.p1{animation-delay:1.1s}.pd.p2{animation-delay:.6s}.pd.p3{animation-delay:.2s}
.pd .nm{font-weight:800;font-size:1.35em;line-height:1.3}
.pd .cn{color:var(--gold);font-family:var(--fd);font-size:1.7em}
.pd .bk{margin-top:.3em;border-radius:.8em .8em 0 0;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1d00;font-family:var(--fd);font-size:2.4em;display:flex;align-items:flex-start;justify-content:center;padding-top:.15em}
.pd.p1 .bk{height:3.6em}.pd.p2 .bk{height:2.7em;background:linear-gradient(180deg,#f2f4fb,#a5acc6)}.pd.p3 .bk{height:2em;background:linear-gradient(180deg,#f0b88a,#a8693c)}
.rk{display:grid;grid-template-columns:repeat(auto-fill,minmax(12.5em,1fr));gap:.45em;animation:rise .6s 1.6s both}
.rk div{background:var(--card);border-radius:.6em;padding:.35em .8em;display:flex;gap:.6em;font-weight:700}
.rk .n{color:var(--mut);min-width:2.3em}
.rk .c{margin-left:auto;color:var(--gold)}
.rjb{position:fixed;top:4.2em;left:50%;transform:translateX(-50%);z-index:40;display:grid;gap:.5em;font-size:clamp(13px,1.05vw,26px)}
.rj{display:flex;align-items:center;gap:.7em;background:#2b1f4d;border:2px solid var(--gold);border-radius:1em;padding:.6em .8em .6em 1.1em;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:pop .3s both}
.rj span{font-weight:700}.rj .btn{padding:.45em .9em}
.tbars{display:grid;gap:.7em;margin-top:1em}
.tbar{display:grid;grid-template-columns:16em 1fr 9em;gap:1em;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:.9em;padding:.6em 1em;animation:rise .6s both;animation-delay:var(--d)}
.tbar.win{animation:rise .6s both,winhl .45s both;animation-delay:var(--d),calc(var(--d) + 1.25s)}
@keyframes winhl{from{border-color:var(--line);box-shadow:none}to{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,194,77,.3)}}

<script>
// ▼▼▼ Firebase 설정값 (math-games 프로젝트) ▼▼▼
const FIREBASE_CONFIG = null;   // 체험판: 서버 없이 이 브라우저 안에서만 동작
// ▲▲▲ 주소 뒤에 ?local=1 을 붙이면 서버 없이 이 브라우저의 탭끼리만 연결되는 테스트 모드(봇 추가 가능)

const DEMO = true;                     // demo.html에서는 true (서버 없이 봇과 한 판)
const TEACHER_PW = '0815';             // 선생님 메뉴 비밀번호
const RULE_VERSION = 'v1.10.1 (2026-10-26)'; // v1.10.1: 칠판 막대에 재입장 QR · v1.10: 최종 1등 동점이면 동점 팀끼리 남은 코인으로 재경기 · 평가용 기록(응답 시간·재입장·개인 순위·O/X 횟수 등, 엑셀 '평가용' 시트) · v1.9: 간식 = 우승팀 + 나머지 인원 순위 절반, 개인 순위 1위부터 한 명씩 공개 · v1.8.1: 투자 화면 1코인 조절(− + 꾹 누르기, 끌기 막대) · v1.8: 투자 1코인 단위, 최종 결과 한 팀씩 공개, 개인 순위 절반 표시 · v1.7: 방 번호 없이 이름만 입장, 같은 이름으로 다시 오면 이어서 · v1.6: O/X 5라운드(10·20·30·40·50, 2·3·3·4·4명) + 최종, 기본 비밀 라운드 4라운드 · v1.5: X가 한 명이라도 있으면 경보 → 금고 절반이 날아가고 남은 절반을 X끼리 나눔(O는 0), 라운드마다 코인 순위 · v1.4: 라운드별 코인·비밀 라운드(여러 개 가능)를 선생님이 설정(기록에 stakes·seals 저장, 기본 10·20·30·40 / 3라운드) · v1.3: 칭호는 해당자가 딱 1명일 때만 · v1.3: 칭호는 해당자가 딱 1명일 때만 · 규칙이 바뀌면 올리기: 1R 짝수 개의 2명 짝(필요시 3명)·2~4R 3·3·4명, 경보 시 O끼리, 3R 본인만, 최종 = 1R 두 팀 합쳐 4~5명(코인 균형)
const PARAMS = new URLSearchParams(location.search);
const LOCAL = DEMO || !FIREBASE_CONFIG || PARAMS.has('local');
const ROOM = 'game';   // v1.7: 방은 하나뿐 — 방 번호 없이 이름만으로 입장
const NR = 5, FR = NR+1, RS = [1,2,3,4,5];   // O/X 라운드 수, 최종 라운드 번호(투자)
const STAKES = [10, 20, 30, 40, 50];
const DEF_SIZES = [2,3,3,4,4];
const sizesCfg = room => { const c=(room&&room.cfg&&room.cfg.sizes)||[]; return DEF_SIZES.map((d,i)=>c[i]||d); };
const DEF_LOCK = [false,false,false,true,false];   // 라운드별 잠금(비밀) 기본값: 4라운드만
// 선생님 설정(로비에서 변경): cfg.stakes = 라운드별 1인당 코인, cfg.seal = 비밀 라운드
const stakeIn = (room, r) => { const s=room&&room.cfg&&room.cfg.stakes; return (s && s[r-1]) || STAKES[r-1]; };
// 잠긴(비밀) 라운드 목록. cfg.lock = [1R..5R] 참/거짓 (예전 방의 cfg.seal 숫자도 읽음)
const sealsIn = room => { const c=(room&&room.cfg)||{};
  if (Array.isArray(c.lock)) return RS.filter(r=>!!c.lock[r-1]);
  if (c.seal!==undefined && c.seal!==null) return +c.seal ? [+c.seal] : [];
  return RS.filter(r=>DEF_LOCK[r-1]); };
const KIND = {
  share:{t:'모두 함께 열었다!', s:'다음 날 금고를 함께 열어 똑같이 나눠요', cls:'k-share'},
  steal:{t:'🚨 혼자 털었다!', s:'경보에 금고 절반이 날아가고, X 혼자 나머지를 가져가요. O는 0', cls:'k-steal'},
  alarm:{t:'🚨 여럿이 털었다!', s:'경보에 금고 절반이 날아가고, X끼리 나머지를 나눠요. O는 0', cls:'k-alarm'}
};
const VAULT = `<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="8" y="10" width="104" height="96" rx="14" fill="#2A3874" stroke="#F4C24D" stroke-width="4"/><circle cx="60" cy="58" r="31" fill="#1B2656" stroke="#F4C24D" stroke-width="4"/><circle cx="60" cy="58" r="8" fill="#F4C24D"/><g stroke="#F4C24D" stroke-width="5" stroke-linecap="round"><line x1="60" y1="34" x2="60" y2="46"/><line x1="60" y1="70" x2="60" y2="82"/><line x1="36" y1="58" x2="48" y2="58"/><line x1="72" y1="58" x2="84" y2="58"/></g><rect x="18" y="104" width="16" height="8" rx="3" fill="#F4C24D"/><rect x="86" y="104" width="16" height="8" rx="3" fill="#F4C24D"/></svg>`;
const SEALED = `<svg viewBox="0 0 120 130" aria-hidden="true"><rect x="8" y="10" width="104" height="96" rx="14" fill="#2A3874" stroke="#F4C24D" stroke-width="4"/><circle cx="60" cy="58" r="31" fill="#1B2656" stroke="#F4C24D" stroke-width="4"/><path d="M14 30 L106 86 M106 30 L14 86" stroke="#F05A68" stroke-width="7" stroke-linecap="round" opacity=".9"/><path d="M44 94 v-12 a16 16 0 0 1 32 0 v12" fill="none" stroke="#FFE39C" stroke-width="7"/><rect x="36" y="92" width="48" height="34" rx="7" fill="#F4C24D"/><circle cx="60" cy="107" r="5" fill="#2A3874"/><rect x="58" y="108" width="4" height="10" fill="#2A3874"/></svg>`;

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = LOCAL ? sessionStorage : localStorage;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const App = {mode:null, code:null, pid:null, room:null, unsub:null, lastKey:'', offset:0, sel:null,
  showRec:false, showHist:false, busy:false, botSched:new Set(), lock:null, demoPid:null, revealTimer:null};
const now = () => Date.now() + App.offset;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200); }

// 확인창: 브라우저 confirm 대신 화면 안에 띄움 (전자칠판에서도 크게 보이도록)
function ask(msg, okLabel='확인', cancelLabel='취소'){
  return new Promise(res=>{
    const m=$('#modal');
    m.innerHTML=`<div class="mdl"><div class="mdl-in"><p>${msg}</p><div class="mdl-b"><button class="btn" data-m="0">${cancelLabel}</button><button class="btn gold" data-m="1">${okLabel}</button></div></div></div>`;
    m.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ m.innerHTML=''; res(b.dataset.m==='1'); });
  });
}

// ===== 배경음악 (선생님 화면에서만, 브라우저가 직접 만드는 소리) =====
const BGM = {
  ctx:null, on:false, timer:null, gain:null, step:0, t:0,
  want(){ try { const v=localStorage.getItem('trustBgm'); return v===null ? !DEMO : v==='1'; } catch(e){ return !DEMO; } },
  setWant(v){ try { localStorage.setItem('trustBgm', v?'1':'0'); } catch(e){} },
  start(){
    if (this.on) return;
    try { this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)(); this.ctx.resume(); } catch(e){ return; }
    this.on=true; this.gain=this.ctx.createGain(); this.gain.gain.value=0; this.gain.connect(this.ctx.destination);
    this.gain.gain.setTargetAtTime(0.06, this.ctx.currentTime, 1.2);
    this.t=this.ctx.currentTime+0.15; this.timer=setInterval(()=>this.sched(), 120);
  },
  stop(){
    if (!this.on) return; this.on=false; clearInterval(this.timer);
    const g=this.gain; g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.25); setTimeout(()=>g.disconnect(), 1500);

      get:p=>ref(p).get().then(s=>s.val()),
      on:(p,cb)=>{ const r=ref(p), h=s=>cb(s.val()); r.on('value',h); return ()=>r.off('value',h); },
      onConn:cb=>db.ref('.info/connected').on('value',s=>cb(!!s.val()))
    };
  }
  const KEY = DEMO ? 'trustDemoDB' : 'trustLocalDB';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } };
  const save = o => localStorage.setItem(KEY, JSON.stringify(o));
  const parts = p => p.split('/').filter(Boolean);
  const getAt = (o,p) => parts(p).reduce((a,k)=>a==null?undefined:a[k], o);
  const setAt = (o,p,v) => { const ks=parts(p); let a=o;
    for (let i=0;i<ks.length-1;i++){ if(typeof a[ks[i]]!=='object'||a[ks[i]]===null) a[ks[i]]={}; a=a[ks[i]]; }
    const last=ks[ks.length-1];
    if (v===null||v===undefined) delete a[last]; else a[last]=JSON.parse(JSON.stringify(v)); };
  const withLock = fn => (navigator.locks ? navigator.locks.request(KEY, ()=>{ fn(); }) : Promise.resolve(fn()));
  const subs = [];
  const notify = () => setTimeout(() => { const o=load(); subs.slice().forEach(s=>{ const v=getAt(o,s.p); s.cb(v===undefined?null:JSON.parse(JSON.stringify(v))); }); }, 0);
  addEventListener('storage', e => { if (e.key===KEY) notify(); });
  return {
    mode:'local',
    // 여러 탭이 동시에 쓰면 한쪽 저장이 덮어써질 수 있어, 탭 사이 잠금(Web Locks)으로 하나씩 저장
    set:(p,v)=>withLock(()=>{ const o=load(); setAt(o,p,v); save(o); notify(); }),
    update:(p,v)=>withLock(()=>{ const o=load(); for (const k in v) setAt(o,p+'/'+k,v[k]); save(o); notify(); }),
    get:p=>{ const v=getAt(load(),p); return Promise.resolve(v===undefined?null:JSON.parse(JSON.stringify(v))); },
    on:(p,cb)=>{ const s={p,cb}; subs.push(s); notify(); return ()=>{ const i=subs.indexOf(s); if(i>=0) subs.splice(i,1); }; },
    onConn:cb=>cb(true)
  };
})();

// ===== 게임 규칙 =====
function sizesFor(n, s){
  if (n<=0) return [];
  let t = Math.ceil(n/s);
  while (t>1 && Math.floor(n/t)<2) t--;
  const base=Math.floor(n/t), extra=n%t;
  return Array.from({length:t}, (_,i)=>base+(i<extra?1:0));
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// 팀 편성에 쓰는 '공개된' 라운드: 비밀 라운드 선택은 게임이 끝나야 공개되므로 편성에 쓰지 않음
function knownRounds(r, room){ const sl=sealsIn(room||R()), k=[]; for(let i=1;i<r;i++){ if(sl.includes(i) && r<=NR) continue; k.push(i); } return k; }
// ===== 1라운드 짝과 최종 팀 계획 =====
// 1라운드: 2명 짝(인원이 맞지 않으면 3명 팀), 팀 수는 짝수.
// 최종 라운드: 1라운드 두 팀을 합쳐 4~5명 (2+2 또는 2+3). 3명 팀끼리는 합치지 않음(6명 방지).
// 인원 때문에 짝수로 못 맞출 때만(3·6·7·11명) 3명 팀 하나가 합치지 않고 그대로 최종 팀이 됨.
function teamPlan(N){
  let best=null;
  for (let t=0; 3*t<=N; t++){                       // t: 3명 팀 수, d: 2명 짝 수
    if ((N-3*t)%2) continue; const d=(N-3*t)/2;
    for (let s=0; s<=t; s++){                       // s: 합치지 않는 3명 팀 수
      const m=t-s; if (d<m || (d-m)%2) continue;
      if (!best || s<best.s || (s===best.s && t<best.t)) best={t, d, s, m, dd:(d-m)/2};
      break;
    }
  }
  if (!best) return {r1:[N], fin:[N], solo:0};
  const fin=[...Array(best.m).fill(5), ...Array(best.dd).fill(4), ...Array(best.s).fill(3)];
  return {r1:[...Array(best.d).fill(2), ...Array(best.t).fill(3)], fin, solo:best.s, ...best};
}
// 최종 라운드 팀: 1라운드 팀 두 개씩 합치기(2+3 → 5명, 2+2 → 4명). 팀끼리 1~5라운드 코인 평균이 비슷하도록 맞바꿈
function finalTeams(room, pids){
  const alive=new Set(pids), coin=p=>{ let s=0; for(let r=1;r<=NR;r++) s+=(room.coins&&room.coins['r'+r]&&room.coins['r'+r][p])||0; return s; };
  let units=room.teams.r1.map(t=>t.filter(p=>alive.has(p))).filter(t=>t.length);
  const used=new Set(units.flat()); pids.filter(p=>!used.has(p)).forEach(p=>units.push([p]));   // 중간에 들어온 학생
  units=units.map(u=>({u, n:u.length, v:u.reduce((a,p)=>a+coin(p),0)}));
  let groups=null;
  const duos=units.filter(x=>x.n===2).sort((a,b)=>b.v-a.v), trios=units.filter(x=>x.n===3).sort((a,b)=>b.v-a.v);
  if (duos.length+trios.length===units.length) {
    const d=duos.length, t=trios.length; let s=-1;
    for (let k=0;k<=t;k++){ const m=t-k; if (d>=m && (d-m)%2===0) { s=k; break; } }
    if (s>=0) {
      groups=[];
      const solo=trios.splice(trios.length-s, s);                       // 합치지 않는 3명 팀
      trios.forEach(x=>{ const y=duos.pop(); groups.push([x,y]); });     // 코인 많은 3명 팀 + 코인 적은 짝
      while (duos.length) groups.push([duos.shift(), duos.pop()]);       // 남은 짝끼리 (많은+적은)
      solo.forEach(x=>groups.push([x]));
    }
  }
  if (!groups) {                                                       // 예외(중간에 나간 학생 등): 두 단위씩 차례로 합치기
    units.sort((a,b)=>b.v-a.v); groups=[];
    while (units.length) { const a=units.shift(); const b=units.length && a.n<4 ? units.pop() : null; groups.push(b?[a,b]:[a]); }
    const lone=groups.findIndex(g=>g.length===1 && g[0].n<3);
    if (lone>=0 && groups.length>1) { const [x]=groups.splice(lone,1)[0]; groups.sort((a,b)=>a.reduce((s,y)=>s+y.n,0)-b.reduce((s,y)=>s+y.n,0))[0].push(x); }
  }
  // 같은 인원 단위끼리 맞바꿔 팀 평균 코인 차이 줄이기 (인원 구성은 그대로)
  const sz=g=>g.reduce((a,x)=>a+x.n,0), av=g=>g.reduce((a,x)=>a+x.v,0)/sz(g);
  const spread=()=>{ const a=groups.map(av); return Math.max(...a)-Math.min(...a); };
  for (let it=0; it<300; it++){
    let improved=false; const cur=spread();
    outer: for (let a=0;a<groups.length;a++) for (let b=a+1;b<groups.length;b++)
      for (let i=0;i<groups[a].length;i++) for (let j=0;j<groups[b].length;j++){
        const x=groups[a][i], y=groups[b][j]; if (x.n!==y.n) continue;
        groups[a][i]=y; groups[b][j]=x;
        if (spread()<cur-1e-9) { improved=true; break outer; }
        groups[a][i]=x; groups[b][j]=y;
      }
    if (!improved) break;
  }
  return shuffle(groups.map(g=>g.flatMap(x=>x.u)));
}
function makeTeams(room, r){
  const pids = Object.keys(room.players || {});
  if (r===FR && room.teams && room.teams.r1) return finalTeams(room, pids);
  const size = sizesCfg(room)[r-1] || 4;
  let order;
  if (r===1) {                                         // 1라운드: 짝수 개의 2명 짝(필요하면 3명 팀)
    order = shuffle(pids); const teams=[]; let i=0;
    for (const sz of teamPlan(order.length).r1) { teams.push(order.slice(i,i+sz)); i+=sz; }
    return shuffle(teams);
  } else {
    const known = knownRounds(r, room), sc = {};
    pids.forEach(p=>{ let o=0; known.forEach(k=>{ if(room.choices && room.choices['r'+k] && room.choices['r'+k][p]==='O') o++; }); sc[p]=o+Math.random()*0.9; });
    order = pids.slice().sort((a,b)=>sc[b]-sc[a]);
  }
  const teams=[]; let i=0;
  for (const s of sizesFor(order.length,size)) { teams.push(shuffle(order.slice(i,i+s))); i+=s; }
  return shuffle(teams);
}
function settleRound(room, r){
  const stake=stakeIn(room,r), teams=room.teams['r'+r]||[], raw=(room.choices&&room.choices['r'+r])||{};
  const ch={}, auto={}, coins={}, res=[];
  teams.forEach(t=>{
    t.forEach(p=>{ if(raw[p]==='O'||raw[p]==='X') ch[p]=raw[p]; else { ch[p]='O'; auto[p]=true; } });
    const n=t.length, pot=stake*n, xs=t.filter(p=>ch[p]==='X').length; let kind;
    if (xs===0) { kind='share'; t.forEach(p=>coins[p]=stake); }
    else { kind = xs===1 ? 'steal' : 'alarm';   // v1.5: X가 한 명이라도 있으면 경보 → 금고 절반이 날아가고, 남은 절반을 X끼리 똑같이 나눔(O는 0)
      const each=Math.floor(Math.floor(pot/2)/xs); t.forEach(p=>coins[p]=ch[p]==='X'?each:0); }
    res.push({kind, xs, n, pot});
  });
  return {ch, auto, coins, res};
}

const R = () => App.room || {};
const teamsOf = r => (R().teams && R().teams['r'+r]) || [];
const teamIdx = (r,pid) => teamsOf(r).findIndex(t=>t.includes(pid));
const nameOf = pid => (R().players && R().players[pid] && R().players[pid].name) || '(나감)';
const revealed = r => !!(R().revealed && R().revealed['r'+r]);
const coinsOf = (r,pid) => (R().coins && R().coins['r'+r] && R().coins['r'+r][pid]);
const choiceOf = (r,pid) => (R().choices && R().choices['r'+r] && R().choices['r'+r][pid]);
const isAuto = (r,pid) => !!(R().auto && R().auto['r'+r] && R().auto['r'+r][pid]);
function totalOf(pid, all){ let s=0; for(let r=1;r<=NR;r++) if(all||revealed(r)) s+=coinsOf(r,pid)||0; return s; }
const FIN = () => R().fin || null;
const rmOf = st => (st&&st.rm)||0;                                  // 0 = 최종 투자, k = k번째 재경기
const invNow = () => { const k=rmOf(R().state); return k ? (((R().rematch||{})['k'+k]||{}).invest||{}) : (R().invest||{}); };
const invPath = () => { const k=rmOf(R().state); return k ? `rematch/k${k}/invest` : 'invest'; };
const invTeams = () => { const k=rmOf(R().state); return k ? ((((R().rematch||{})['k'+k]||{}).teams)||[]) : teamsOf(FR).map((t,i)=>i); };
const invPlayers = () => invTeams().flatMap(i=>teamsOf(FR)[i]||[]);                       // 최종 라운드 결과
const remOf = pid => FIN() ? ((FIN().rem||{})[pid]||0) : totalOf(pid,true);
const invOf = pid => FIN() ? ((FIN().inv||{})[pid]||0) : 0;
const snackOf = pid => FIN() ? ((FIN().snack||{})[pid]||'') : '';
const stakeOf = r => stakeIn(R(), r);
const sizeMode = teams => { const c={}; teams.forEach(t=>c[t.length]=(c[t.length]||0)+1); return +Object.keys(c).sort((a,b)=>c[b]-c[a]||b-a)[0]; };   // 가장 흔한 팀 인원 (다른 팀만 인원 표시)
const SEALS = () => sealsIn(R());
const SEAL = () => SEALS().join('·');          // 문구용: '3' 또는 '2·3', 없으면 ''
const isSealed = r => SEALS().includes(r);
const roundTitle = r => '믿음의 금고';          // 라운드 이름은 모두 게임 이름으로 (선생님 요청)
function formation(r){
  if (r===1) return '무작위 2명 짝';
  if (r===FR) return '1라운드 두 팀이 합쳐진 4~5명 팀';
  const k=knownRounds(r), before=SEALS().filter(x=>x<r), note=before.length ? ` (${before.join('·')}라운드는 비밀)` : '';
  if (!k.length) return '무작위로'+note;
  return (k.length===1 ? `${k[0]}라운드에 O를 고른 사람끼리` : `${k.join('·')}라운드에 O를 많이 고른 사람끼리`)+note;
}
function ranking(){
  // 최종 결과가 있으면 남은 코인, 없으면 1~5라운드 합계로 순위
  const list = Object.keys(R().players||{}).map(p=>({p, name:nameOf(p), total:remOf(p)})).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name,'ko'));
  list.forEach((e,i)=>{ e.rank = (i>0 && list[i-1].total===e.total) ? list[i-1].rank : i+1; });
  return list;
}
// 최종 라운드 정산: 투자(비밀 라운드 코인 포함, 가진 만큼만) → 팀 평균 1위 = 우승팀 → 나머지(우승팀 제외)는 남은 코인 순위 절반까지 간식
function computeFinal(room){
  const teams=(room.teams&&room.teams['r'+FR])||[], req=room.invest||{}, inv={}, rem={}, avg=[];
  const tot=p=>{ let s=0; for(let r=1;r<=NR;r++) s+=(room.coins&&room.coins['r'+r]&&room.coins['r'+r][p])||0; return s; };
  const all=Object.keys(room.players||{});
  all.forEach(p=>{ inv[p]=0; rem[p]=tot(p); });
  teams.forEach(t=>{
    let sum=0;
    t.forEach(p=>{ const T=tot(p), a=Math.min(Math.max(0, Math.floor(+req[p]||0)), T); inv[p]=a; rem[p]=T-a; sum+=a; });
    avg.push(t.length ? Math.round(sum/t.length*10)/10 : 0);
  });
  const best=Math.max(0,...avg);
  let win = best>0 ? avg.map((v,i)=>v===best?i:-1).filter(i=>i>=0) : [], lastBest=best;
  // v1.10: 1등 동점이면 동점 팀끼리 '남은 코인'으로 재경기(rematch/k1, k2 …). 재경기에서도 아무도 안 내면 공동 우승
  const RM=room.rematch||{}, rms=[];
  for (let k=1; RM['k'+k]; k++){
    const ts=RM['k'+k].teams||[], q=RM['k'+k].invest||{};
    const ra=ts.map(i=>{ const t=teams[i]||[]; let sm=0; t.forEach(p=>{ const a=Math.min(Math.max(0,Math.floor(+q[p]||0)), rem[p]); inv[p]+=a; rem[p]-=a; sm+=a; }); return t.length?Math.round(sm/t.length*10)/10:0; });
    lastBest=Math.max(0,...ra);
    win = lastBest>0 ? ts.filter((i,j)=>ra[j]===lastBest) : ts.slice();
    rms.push({teams:ts, avg:ra, win:win.slice()});
  }
  const tie = win.length>1 && lastBest>0 && win.some(i=>(teams[i]||[]).some(p=>rem[p]>0));
  const winners=new Set(win.flatMap(i=>teams[i]));
  const snack={}; winners.forEach(p=>snack[p]='team');
  const others=all.filter(p=>!winners.has(p)).sort((a,b)=>rem[b]-rem[a]);
  const slots=Math.floor(others.length/2);   // v1.9: 우승팀을 뺀 나머지 인원의 절반(내림)까지 개인 순위 간식
  let cut=null;
  if (slots>0) {
    cut = rem[others[slots-1]];
    others.forEach(p=>{ if (rem[p]>=cut && rem[p]>0) snack[p]='rank'; });   // 커트라인 동점은 모두 포함, 0코인은 제외
  }
  return {inv, rem, avg, win, snack, cut, slots, half:slots, tie, rms};
}

    else if (pid && players[pid]) {

const pwOK = () => { const v=($('#tpw')||{}).value||''; if (v===TEACHER_PW) return true; setErr('선생님 비밀번호가 맞지 않아요.'); return false; };

function enterRoom(code, mode, pid){

// 전자칠판 한 화면 맞춤: 내용이 넘치면 비율대로 줄여서 스크롤 없이 보이게
function fitBoard(){
  const m=$('.B-main'), f=$('#fit'); if (!m || !f) return;
  f.style.transform='none'; f.style.width='100%';
  const W=m.clientWidth, H=m.clientHeight; let s=1;
  for (let i=0;i<4;i++){
    f.style.width=(W/s)+'px';
    const ns=Math.min(1, H/f.scrollHeight, (W/s)/f.scrollWidth*s);
    if (Math.abs(ns-s)<0.005) { s=ns; break; } s=ns;
  }
  f.style.width=(W/s)+'px'; f.style.transform = s<1 ? `scale(${s})` : 'none';
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if (App.mode==='host') fitBoard(); });

// ===== 진행 (선생님) =====
// 되돌리기용 스냅숏: 게임 진행에 쓰는 칸만 저장 (학생 명단은 그대로)
const SNAP_KEYS=['state','teams','choices','auto','coins','res','revealed','invest','fin','ctime','rematch'];
function snapshot(){ const room=R(), o={}; SNAP_KEYS.forEach(k=>o[k]=room[k]===undefined?null:room[k]); return JSON.stringify(o); }
const histWith = () => [...(R().hist||[]).slice(-7), snapshot()];      // 최근 8단계까지
// 결과가 칠판 연출보다 휴대폰에 먼저 보이지 않도록, 휴대폰은 이 시각 뒤에 공개
const trOf = st => st.tr==null ? teamsOf(FR).length : st.tr;   // 최종 결과: 지금까지 공개한 팀 수
function revealDelay(phase, r, step){
  const nT=teamsOf(phase==='final'?FR:r).length;
  if (phase==='result') return isSealed(r) ? 400 : 0;     // 비밀 라운드가 아니면 팝업을 닫을 때(step 1) 공개
  if (phase==='final') return [600 + nT*350 + 1200, 900 + SEALS().reduce((a,x)=>a+teamsOf(x).length,0)*60, 500, 3700, 0][step]||0;
  return 0;
}
async function next(){
  if (App.busy || (App.mode!=='host' && !DEMO)) return;
  const room=R(), st=room.state||{}, r=st.round||0, base='rooms/'+App.code;
  if (st.phase==='lobby' && Object.keys(room.players||{}).length<2) return toast('2명 이상 입장해야 시작할 수 있어요.');
  if (st.phase==='lobby' && !DEMO) { const w=smallWarn(Object.keys(room.players||{}).length);
    if (w && !(await ask('⚠️ '+w+'<br>그래도 시작할까요?', '시작하기', '기다리기'))) return; }
  if (st.phase==='choose') {
    const [a,b]=submittedCount(r);
    if (a<b && !(await ask(`아직 <b>${b-a}명</b>이 선택하지 않았어요.<br>넘어가면 미제출은 <b class="o">O</b>로 처리돼요.`, '넘어가기', '기다리기'))) return;
  }
  if (st.phase==='invest') {
    const inv=invNow(), all=invPlayers(), miss=all.filter(p=>inv[p]==null).length;
    if (miss && !(await ask(`아직 <b>${miss}명</b>이 투자하지 않았어요.<br>넘어가면 미제출은 <b>투자 0</b>으로 처리돼요.`, '넘어가기', '기다리기'))) return;
  }
  if (st.phase==='final' && (st.step||0)>=4) return;
  App.busy = true;
  try {
    const H={hist:histWith()};
    if (st.phase==='lobby') {
      await startRound(1, H);
    } else if (st.phase==='team') {
      await DB.update(base, {...H, 'state/phase': r===FR ? 'invest' : 'choose', 'state/talkEnd':null, ['openAt/r'+r]:now()});
    } else if (st.phase==='choose') {
      const s=settleRound(room, r);
      const up={...H, ['choices/r'+r]:s.ch, ['auto/r'+r]:Object.keys(s.auto).length?s.auto:null, ['coins/r'+r]:s.coins, ['res/r'+r]:s.res, 'state/phase':'result', 'state/step':0, 'state/at':now()+revealDelay('result',r,0)};
      if (!isSealed(r)) up['revealed/r'+r]=true;    // 비밀 라운드는 게임이 끝날 때까지 칠판에는 봉인 (본인 휴대폰에는 공개)
      await DB.update(base, up);
    } else if (st.phase==='result' && !isSealed(r) && (st.step||0)===0) {
      await DB.update(base, {...H, 'state/step':1, 'state/at':now()+300});   // 팝업을 닫는 순간 휴대폰에도 우리 팀 결과
    } else if (st.phase==='result' && !isSealed(r) && (st.step||0)===1) {
      await DB.update(base, {...H, 'state/step':2, 'state/at':0});   // 코인 순위 (비밀 라운드는 순위가 그대로라 건너뜀)
    } else if (st.phase==='result') {
      await startRound(r+1, H);              // 마지막(NR) 라운드 뒤에는 최종 라운드(1라운드 짝 두 쌍씩, 코인이 비슷한 4명 팀)
    } else if (st.phase==='invest') {
      if (rmOf(st)) await DB.update(base, {...H, 'fin':computeFinal(room), 'state/phase':'final', 'state/step':0, 'state/tr':teamsOf(FR).length, 'state/at':now()+2500});   // 재경기 결과는 바로 비교 막대로
      else await DB.update(base, {...H, 'fin':computeFinal(room), 'state/phase':'final', 'state/step':0, 'state/tr':0, 'state/at':0});   // 팀별로 한 팀씩 공개(tr) → 전체 결과
      saveLog();
    } else if (st.phase==='final' && (st.step||0)===0 && trOf(st) < teamsOf(FR).length) {
      const tr=trOf(st)+1, T=teamsOf(FR).length;
      await DB.update(base, {...H, 'state/tr':tr, 'state/at': tr>=T ? now()+revealDelay('final',FR,0) : 0});
    } else if (st.phase==='final' && (st.step||0)===2 && rvOf(st) < rankList().length) {
      await DB.update(base, {...H, 'state/rv':rvOf(st)+1});   // 개인 순위를 위에서부터 한 명씩
    } else if (st.phase==='final' && (st.step||0)===0 && (FIN()||{}).tie) {
      const k=Object.keys(room.rematch||{}).length+1;   // 동점 → 동점 팀끼리 재경기
      await DB.update(base, {...H, ['rematch/k'+k]:{teams:FIN().win.slice(), at:now()}, 'state/phase':'invest', 'state/rm':k, 'state/at':0, ['openAt/rm'+k]:now()});
    } else if (st.phase==='final') {
      let step=(st.step||0)+1;
      if (step===1 && !SEAL()) step=2;       // 비밀 라운드가 없으면 봉인 해제 단계를 건너뜀
      const up={...H, 'state/step':step, 'state/at':now()+revealDelay('final',FR,step)};
      if (step===2) { up['state/rv']=0; up['state/at']=0; }
      if (step===1) SEALS().forEach(x=>up['revealed/r'+x]=true);
      await DB.update(base, up);
      if (step===3) saveLog();               // 칭호까지 확정된 기록으로 한 번 더 저장
    }
  } catch(e) { console.error(e); toast('저장에 실패했어요. 연결을 확인해 주세요.'); }
  finally { App.busy = false; }
}
async function undo(){
  const h=(R().hist||[]).slice();
  if (!h.length) return toast('되돌릴 단계가 없어요.');
  if (!(await ask('바로 전 단계로 되돌릴까요?<br>이번 단계에서 학생들이 낸 선택은 지워져요.', '되돌리기'))) return;
  const snap=JSON.parse(h.pop()), up={hist:h.length?h:null, undos:(R().undos||0)+1};
  SNAP_KEYS.forEach(k=>up[k]=snap[k]);
  if (up.state) up.state.at=0;
  App.botSched.clear();
  await DB.update('rooms/'+App.code, up);
  toast('이전 단계로 돌아왔어요.');
}
async function startRound(r, extra){

}
// ===== 평가용 정보: 학생 한 명의 플레이 요약 =====
const respSec = (r,p) => { const a=((R().openAt||{})['r'+r]), t=(((R().ctime||{})['r'+r])||{})[p]; return (a&&t) ? Math.max(0,Math.round((t-a)/1000)) : null; };
function evalOf(p){
  const F=FIN()||{}, st=playerStats(p), rl=rankList(), me=rl.find(e=>e.p===p), ti=teamIdx(FR,p), got=totalOf(p,true), inv=invOf(p);
  const KN={share:'함께',steal:'혼자 턺',alarm:'여럿이 턺'}; let missed=0; const kinds=[], secs=[];
  for (let r=1;r<=NR;r++){ const t=teamIdx(r,p); if (t<0) { kinds.push(''); secs.push(null); continue; } if (isAuto(r,p)) missed++;
    kinds.push(KN[((((R().res||{})['r'+r])||[])[t]||{}).kind]||''); secs.push(isAuto(r,p)?null:respSec(r,p)); }
  const invMissed = ti>=0 && F.inv && (R().invest||{})[p]==null;
  const ok=secs.filter(v=>v!=null);
  return { oCount:st.oCount, xCount:st.xs, missed, shares:st.shares, steals:st.steals, bestSteal:st.bestSteal, robbed:st.robbed, kinds, secs,
    avgSec: ok.length?Math.round(ok.reduce((a,b)=>a+b,0)/ok.length):null, invSec: respSec(FR,p), invMissed,
    gathered:got, invest:inv, investPct: got?Math.round(100*inv/got):0, remain:remOf(p), finalTeam:ti+1, teamAvg:ti>=0?((F.avg||[])[ti]??''):'', win:(F.win||[]).includes(ti),

  }

function myResult(r, label){

function phoneResult(r, step){

function phoneFinal(){
  const F=FIN(), st=R().state||{}, step=st.step||0; if(!F) return '';
  const ti=teamIdx(FR,App.pid), avg=F.avg||[], win=(F.win||[]).includes(ti);
  const order=avg.map((v,i)=>i).sort((a,b)=>avg[b]-avg[a]); const trank=order.indexOf(ti)+1;
  const rmt=(F.rms||[]).some(x=>x.teams.includes(ti)), tieMe=F.tie&&(F.win||[]).includes(ti);
  if (tieMe) return `<div class="rbox"><div class="rn">FINAL · ${ti+1}팀</div><div class="rankbig">⚔️</div><div class="rt">1등 동점!</div><p class="tip">남은 코인으로 재경기를 해요.<br>선생님이 시작하면 다시 투자해요.</p></div>`;
  let h=`<div class="rbox"><div class="rn">FINAL · ${ti+1}팀${rmt?' · ⚔️ 재경기':''}</div>${win?'<div class="rankbig">🏆</div><div class="rt">우승팀! 🍪 간식</div>':`<div class="rt">우리 팀 ${trank}위</div>`}
    <p class="tip">우리 팀 평균 투자 <b class="g">${avg[ti]||0}</b>${avg.length?` · 1위 팀 평균 ${Math.max(...avg)}`:''}</p></div>`;
  if (step>=1) SEALS().forEach(x=>{ h+=myResult(x,`🔓 ${x}라운드 봉인 해제`); });

    const sn=snackOf(App.pid);

      <p class="tip">모은 코인 ${totalOf(App.pid,true)} − 투자 ${invOf(App.pid)} = 남은 <b class="g">${remOf(App.pid)}코인</b>${me?`<br>개인 순위 ${me.r2}위 (우승팀 제외 ${list.length}명 중)`:''}</p></div>`+h;
  }
  if (step>=3) h=myTitles()+h;

function myTitles(){
  if (((R().state||{}).step||0)<3) return '';

function histOverlay(){

}
// 제출은 한 번 더 확인해서, 저장이 빠졌으면 다시 보냄 (불안정한 와이파이·테스트 모드 대비)
async function sureSet(path, v, phase){
  await DB.set(path, v);
  setTimeout(async ()=>{ try { if ((R().state||{}).phase===phase && (await DB.get(path))==null) await DB.set(path, v); } catch(e){} }, 900);
}
async function submit(){
  const st=R().state||{}, r=st.round, c=App.sel;
  if (st.phase!=='choose' || !c) return;
  if (choiceOf(r,App.pid)) return;
  try { await sureSet(`rooms/${App.code}/choices/r${r}/${App.pid}`, c, 'choose'); App.sel=null; DB.set(`rooms/${App.code}/ctime/r${r}/${App.pid}`, now()).catch(()=>{}); }
  catch(e){ toast('제출에 실패했어요. 다시 눌러 주세요.'); }
}

// ===== 버튼 처리 =====
// 투자 금액: 다시 그리지 않고 숫자·막대만 바꿔서 끌기·꾹 누르기가 끊기지 않게
function setInv(v){
  const r=$('#invR'), max=r?+r.max:0;
  App.inv=Math.max(0,Math.min(max,Math.round(+v||0)));
  const V=$('#invV'); if (V) V.textContent = (App.inv>=max && max>0) ? '전부' : App.inv;
  if (r) { r.value=App.inv; r.style.setProperty('--p', (max?100*App.inv/max:0)+'%'); }
}
app.addEventListener('input', e => { if (e.target.id==='invR') { App.drag=true; setInv(e.target.value); } });
app.addEventListener('pointerdown', e => {
  if (e.target.id==='invR') { App.drag=true; return; }
  const b=e.target.closest('[data-hold]'); if (!b) return;
  const d=+b.dataset.d; let n=0; App.holdUsed=false; clearTimeout(App.holdT); clearInterval(App.holdI);
  App.holdT=setTimeout(()=>{ App.holdI=setInterval(()=>{ n++; App.holdUsed=true; setInv((App.inv||0)+d*(n>15?5:1)); }, 90); }, 420);
});
const endHold=()=>{ clearTimeout(App.holdT); clearInterval(App.holdI); if (App.drag) { App.drag=false; if (App.pend) { App.pend=false; render(); } } };
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t, endHold));
app.addEventListener('change', e => { if (e.target.id==='invR') endHold(); });
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  if (b.classList.contains('ov') && e.target.closest('[data-stop]')) return;
  const a=b.dataset.a, base='rooms/'+App.code;
  switch(a){
    case 'join': return join();
    case 'dn': demoN=Math.min(30,Math.max(3,demoN+(+b.dataset.d))); $('#dnv').textContent=demoN+'명'; return;
    case 'demo-start': return startDemo();
    case 'create': return createRoom();
    case 'resume': return resumeHost();
    case 'next': return next();
    case 'undo': return undo();
    case 'xlsx': return downloadXLSX();
    case 'bgm': BGM.setWant(!BGM.on); bgmSync(); return render();
    case 'kick': if (await ask(esc(nameOf(b.dataset.p))+' 학생을 명단에서 뺄까요?','빼기')) DB.set(`${base}/players/${b.dataset.p}`, null); return;
    case 'size': { const sizes=sizesCfg(R()).slice(), i=+b.dataset.r; sizes[i]=Math.min(5,Math.max(2,sizes[i]+(+b.dataset.d))); return DB.set(base+'/cfg/sizes', sizes); }
    case 'stake': { const st=RS.map(stakeOf), i=+b.dataset.r; st[i]=Math.min(200,Math.max(10,st[i]+(+b.dataset.d))); return DB.set(base+'/cfg/stakes', st); }
    case 'lock': { const l=RS.map(isSealed), i=+b.dataset.r; l[i]=!l[i]; return DB.set(base+'/cfg/lock', l); }
    case 'talk': return DB.set(base+'/state/talkEnd', now()+((R().cfg&&R().cfg.talk)||90)*1000);
    case 'bot': return addBots(+b.dataset.n);
    case 'rec': App.showRec=true; return render();
    case 'rec-close': App.showRec=false; return render();
    case 'csv': return downloadCSV();
    case 'fs': if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); return;
    case 'exit': if (await ask('처음 화면으로 나갈까요?<br>게임은 그대로 남아 있어요. 학생은 같은 이름을 입력하면 이어서 할 수 있어요.','나가기')) leave(); return;
    case 'pick': App.sel=b.dataset.c; return render();
    case 'cancel': App.sel=null; return render();
    case 'submit': return submit();
    case 'inv-d': if (App.holdUsed) { App.holdUsed=false; return; } return setInv((App.inv||0)+(+b.dataset.d));
    case 'inv-set': return setInv(+b.dataset.v);
    case 'inv-ok': App.sel='inv'; return render();
    case 'inv-submit': { const st=R().state||{}; if (st.phase!=='invest' || invNow()[App.pid]!=null) return;
      const k=rmOf(st), max=k?remOf(App.pid):totalOf(App.pid,true), v=Math.min(App.inv||0, max);
      try { await sureSet(`rooms/${App.code}/${invPath()}/${App.pid}`, v, 'invest'); App.sel=null; DB.set(`rooms/${App.code}/ctime/${k?'rm'+k:'r'+FR}/${App.pid}`, now()).catch(()=>{}); } catch(e){ toast('제출에 실패했어요. 다시 눌러 주세요.'); } return; }
    case 'hist': App.showHist=true; return render();
    case 'qrbig': App.qrBig=!App.qrBig; return render();
    case 'hist-close': App.showHist=false; return render();
    case 'rules': toast(((R().state||{}).round===FR) ? '팀 평균 투자 1위 팀 우승 · 나머지는 남은 코인 순위' : '모두 O → 똑같이 나눔 · X가 있으면 → 경보! 절반이 날아가고 X끼리 나눔, O는 0'); return;
  }
});
document.addEventListener('keydown', e => {
  if (App.mode!=='host') return;
  if (e.target && e.target.tagName==='INPUT') return;
  if ($('#modal').innerHTML) return;
  if (e.key==='ArrowRight' || e.key==='PageDown') { e.preventDefault(); next(); }
  if (e.key==='ArrowLeft' || e.key==='PageUp') { e.preventDefault(); undo(); }
  if (e.key==='Escape' && App.showRec) { App.showRec=false; render(); }
});

// ===== 체험판 (demo.html) =====
let demoN = 20;
function renderDemoEntry(){
  App.mode=null; document.body.classList.remove('board'); document.body.classList.add('demo'); $('#demobar').innerHTML='';
  app.innerHTML = `
  <div class="E">
    <div class="E-logo">${VAULT}</div>
    <h1 class="E-title">믿음의 금고</h1>
    <p class="E-sub">혼자 체험해 보기 · 봇과 함께 한 판</p>
    <div class="card" style="text-align:center">
      <label>함께 할 인원 (나 포함)</label>
      <div class="dn"><button class="btn" data-a="dn" data-d="-1">−</button><b id="dnv">${demoN}명</b><button class="btn" data-a="dn" data-d="1">+</button></div>
      <button class="btn gold big" data-a="demo-start">체험 시작</button>
    </div>
    <p class="note">아래 막대에서 📱 내 휴대폰과 📺 선생님 화면을 오가며 볼 수 있어요.<br>서버 없이 이 브라우저 안에서만 돌아가는 연습용이에요.</p>
  </div>`;
}
async function startDemo(){
  try { localStorage.removeItem('trustDemoDB'); } catch(e){}
  const code='0000', me=uid(), players={[me]:{name:'나', t:Date.now()}};
  for (let i=1;i<demoN;i++) players[uid()]={name:'봇'+String(i).padStart(2,'0'), t:Date.now()+i, bot:true};
  await DB.set('rooms/'+code, {created:Date.now(), host:'demo', cfg:{sizes:DEF_SIZES.slice(), talk:90, stakes:STAKES.slice(), lock:DEF_LOCK.slice()}, state:{phase:'lobby', round:0, step:0}, players});
  App.demoPid=me; App.botSched.clear();
  enterRoom(code, 'player', me);
  toast('📺 선생님 화면에서 ‘게임 시작’을 눌러요');
}
function demoView(v){
  if (!App.code) return;
  App.mode = v; App.pid = App.demoPid; App.lastKey=''; App.showRec=false; App.showHist=false;
  document.body.classList.toggle('board', v==='host'); bgmSync(); render();
}
function renderDemoBar(){
  const bar=$('#demobar'); if (!App.code) { bar.innerHTML=''; return; }
  const h=App.mode==='host', st=R().state||{}, done=st.phase==='final'&&(st.step||0)>=4;
  bar.innerHTML = `<div class="db">
    <button class="btn ${h?'':'on'}" data-d="player">📱 내 휴대폰</button>
    <button class="btn ${h?'on':''}" data-d="host">📺 선생님 화면</button>
    ${h?'':`<button class="btn" data-d="next" ${done?'disabled':''}>⏭ 다음 단계</button>`}
    <button class="btn ghost" data-d="exit">나가기</button></div>`;
  bar.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{
    const d=b.dataset.d;
    if (d==='next') return next();
    if (d==='exit') { if (await ask('체험을 끝낼까요?','끝내기')) { leave(); renderDemoEntry(); } return; }
    demoView(d);
  });
}

// ===== 연결 상태 =====
if (DB) { let t; DB.onConn(c=>{ clearTimeout(t); if (c) $('#net').classList.remove('on'); else t=setTimeout(()=>$('#net').classList.add('on'), 2500); }); }

// ===== 시작 =====
(async () => {
  if (!DB) return renderEntry();
  if (DEMO) return renderDemoEntry();
  try {
    const room = await DB.get('rooms/'+ROOM);
    if (room) {
      if (store.getItem('trustRole')==='host' && room.host===store.getItem('trustHost_'+ROOM)) return enterRoom(ROOM, 'host');
      const pid = store.getItem('trustPid_'+ROOM);
      if (pid && room.players && room.players[pid]) return enterRoom(ROOM, 'player', pid);
    }
  } catch(e){}
  renderEntry();
})();
</script>
